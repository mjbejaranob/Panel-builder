<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote - Green Power Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Request a Quote</h1></header>
    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            <label>Name:<input type="text" name="name" required></label><br>
            <label>Email:<input type="email" name="email" required></label><br>
            <label>Company:<input type="text" name="company"></label><br>
            <label>Service Type:
                <select name="service">
                    <option>ELV Systems</option>
                    <option>Energy Management</option>
                    <option>Industrial Panels</option>
                </select>
            </label><br>
            <label>Project Specs:<textarea name="specs"></textarea></label><br>
            <label>Upload Files:<input type="file" name="files"></label><br>
            <button type="submit" class="cta">Submit</button>
        </form>
    </main>
    <footer><a href="index.html">Back to Home</a></footer>
</body>
</html>
