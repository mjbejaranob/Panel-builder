<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a quote from Green Power Link by submitting your project details.">
  <meta name="keywords" content="Request Quote, Project Specification, ELV, Control Panels">
  <title>Green Power Link | Request a Quote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="logo-placeholder.png" alt="Green Power Link Logo">
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="industries.html">Industries</a></li>
          <li><a href="request-quote.html">Request a Quote</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <section class="quote-form container">
      <h1>Request a Quote</h1>
      <form id="quoteForm">
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Phone</label>
        <input type="tel" name="phone">
        <label>Project Specifications</label>
        <textarea name="specs" rows="5" required></textarea>
        <label>Upload Files</label>
        <input type="file" name="files" multiple>
        <button type="submit" class="btn">Submit</button>
      </form>
      <div id="modal" class="modal">
        <div class="modal-content">
          <p>Sending your request...</p>
        </div>
      </div>
    </section>
    <script>
      document.getElementById('quoteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('modal').style.display = 'block';
        // Implement email submission backend integration
      });
    </script>
  </main>
  <footer>
    <p>&copy; 2025 Green Power Link. All rights reserved.</p>
  </footer>
</body>
</html>
